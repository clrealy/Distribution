---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - name: wheel
      must_exist: false
      system: true
    - audio
    - video
    - lp
    - network
    - storage
    - optical
    - scanner

sudoersGroup: wheel
sudoersConfigureWithGroup: true

setRootPassword: false
doReusePassword: false
doAutologin: false

passwordRequirements:
    minLength: 4
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false

user:
    shell: /bin/bash
    forbidden_names: [ root, liveuser ]

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "distribution-${cpu}"
    forbidden_names: [ localhost ]
