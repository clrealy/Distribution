---
# turn the copied live system into a normal installed system
dontChroot: false
timeout: 900
script:
    # live-only initramfs + boot stuff
    - "rm -f /etc/mkinitcpio.conf.d/archiso.conf"
    - "cp /usr/share/distribution/linux.preset /etc/mkinitcpio.d/linux.preset"
    # live session leftovers
    - "rm -f /etc/sddm.conf.d/autologin.conf /etc/sudoers.d/liveuser"
    - "rm -rf /etc/systemd/system/getty@tty1.service.d"
    - "rm -f /etc/systemd/journald.conf.d/volatile-storage.conf /etc/systemd/logind.conf.d/do-not-suspend.conf"
    - "rm -f /etc/ssh/sshd_config.d/10-archiso.conf /etc/motd /root/.automated_script.sh /root/.zlogin"
    - "rm -f /etc/systemd/system/multi-user.target.wants/sshd.service"
    - "rm -f /etc/xdg/autostart/distribution-installer.desktop"
    # the live root account has no password. lock it.
    - "passwd -l root"
    # pacman keys (the live keyring lived in RAM)
    - "pacman-key --init"
    - "pacman-key --populate archlinux"
    # the installer doesn't need to stay installed
    - "pacman -Rns --noconfirm calamares || true"
