---
overwrite: false
keep_distributor: false
prefer_grub_d: false
kernel_params: [ "quiet" ]   # "splash" gets added automatically since plymouth is installed
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "saved"
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: "console"
    GRUB_DISABLE_RECOVERY: true
always_use_defaults: true
