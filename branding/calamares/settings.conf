# Distribution. installer — Calamares main config
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:     copykernel
  module: shellprocess
  config: shellprocess_copykernel.conf
- id:     cleanup
  module: shellprocess
  config: shellprocess_cleanup.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - shellprocess@copykernel
  - removeuser
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - shellprocess@cleanup
  - initcpiocfg
  - initcpio
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: distribution
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
